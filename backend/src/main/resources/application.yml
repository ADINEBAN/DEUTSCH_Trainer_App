server:
  port: ${PORT:8080}

spring:
  application:
    name: deutsch-trainer-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deutsch_trainer}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # NEVER commit a real secret. Set JWT_SECRET env var in production.
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-min-32-chars-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    reset-token-expiration-ms: 1800000 # 30 minutes
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  speechify:
    api-key: ${SPEECHIFY_API_KEY:}
    api-url: ${SPEECHIFY_API_URL:https://api.speechify.ai/v1/audio/speech}
    model: ${SPEECHIFY_MODEL:simba-3.0}
    # Default German voice. simba-3.0 is required for non-English voices
    # (simba-3.2 is English-only and rejects German voices with 400).
    # "amalia" = German (de-DE) voice from the official Speechify demos repo
    # (demos/multilingual-voiceover/app/lib/languages.ts, via GET /v1/voices).
    voice: ${SPEECHIFY_VOICE_ID:amalia}
  ai:
    api-key: ${AI_API_KEY:}
    api-base: ${AI_API_BASE:https://api.openai.com/v1}
    model: ${AI_MODEL:gpt-4o-mini}
    daily-char-limit: ${AI_DAILY_CHAR_LIMIT:200000}
    vision-model: ${AI_VISION_MODEL:gpt-4o-mini}
  storage-dir: ${STORAGE_DIR:./uploads}

logging:
  level:
    com.deutschtrainer: INFO
    org.hibernate.SQL: WARN
